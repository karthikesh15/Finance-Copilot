<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Finance Copilot{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-indigo-600">Micro-SMB Finance Copilot</h1>
      <p class="text-gray-500 text-sm mt-1">{% block subtitle %}{% endblock %}</p>
    </div>
    {% if error %}
    <div class="bg-red-50 text-red-700 border border-red-200 rounded-lg p-3 text-sm mb-4">{{ error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
